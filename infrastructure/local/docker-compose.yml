# Из корневой директории проекта
# docker compose -f infrastructure/local/docker-compose.yml up -d

# Проверь доступность MongoDB:
# docker exec -it docproc-mongodb mongosh --eval 'db.adminCommand({ ping: 1 })'
services:
  mongodb:
    image: mongo:5.0.31
    container_name: docproc-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: docproc

    volumes:
      - docproc-mongodb-data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  docproc-mongodb-data:
