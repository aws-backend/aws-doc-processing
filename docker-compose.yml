services:

  mongodb:
    image: mongo:8.0
    container_name: aws-docproc-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./local/mongodb/init-replica-set.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    container_name: aws-docproc-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: eu-north-1
    ports:
      - "4566:4566"
    volumes:
      - ./local/localstack:/etc/localstack/init/ready.d:ro
      - localstack_data:/var/lib/localstack

volumes:
  mongodb_data:
  localstack_data: