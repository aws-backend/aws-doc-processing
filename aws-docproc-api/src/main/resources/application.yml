server:
  port: 8080

aws:
  region: eu-north-1

spring:
  application:
    name: aws-docproc-api

  profiles:
    default: local

  mvc:
    servlet:
      path: /api/v1

  output:
    ansi:
      enabled: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true