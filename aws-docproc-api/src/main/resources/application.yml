spring:
  application:
    name: aws-docproc-api

  profiles:
    default: local

  output:
    ansi:
      enabled: always # Включить поддержку ANSI

server:
  port: 8080

app:
  aws:
    region: eu-north-1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always